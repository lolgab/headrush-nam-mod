name: gui build

# Milestone 6 (see .claude/plans/crystalline-baking-moonbeam.md): builds
# the GUI on every push/PR touching it (or the patch/nam_core sources its
# blobs depend on), and uploads the resulting binaries as release assets
# on version tags.
#
# Windows builds under MSYS2's MINGW64 environment (native mingw-w64 gcc,
# not the MSYS POSIX layer -- produces a normal Windows .exe depending
# only on the mingw-w64 runtime). curl/xz/SDL2 all have ready-made
# mingw-w64-x86_64-* MSYS2 packages; libext2fs does not (no vcpkg or
# MSYS2 package exists), so scripts/build_e2fsprogs_windows.sh builds
# it from source instead -- confirmed to actually work by cross-compiling
# it for mingw-w64 in Docker before writing that script (see
# docs/BUILDING.md's verification section).
#
# "Depends only on the mingw-w64 runtime" still means real DLLs (libcurl,
# liblzma, SDL2, libwinpthread) that a stock Windows box does not have --
# they don't ship with Windows and MSYS2 isn't installed on end-user
# machines. The exe alone 0xc000007b's / "missing DLL" pop-ups on launch
# (see https://github.com/lolgab/headrush-nam-mod/issues/7); the build
# must ship those DLLs alongside it, not just the .exe.
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "app/**"
      - "tools/**"
      - "third_party/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "patch/**"
      - ".github/workflows/gui-build.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "core/**"
      - "app/**"
      - "tools/**"
      - "third_party/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "patch/**"
      - ".github/workflows/gui-build.yml"

jobs:
  # Cross-compiles blobs/*: no Docker needed in CI (unlike local dev,
  # see scripts/build_blobs.sh) since the runner OS is already Linux --
  # just install the same Bootlin ARM toolchain docker/Dockerfile uses and
  # run scripts/build_blobs_native.sh directly.
  build-blobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nam_core
        run: ./scripts/fetch_nam_core.sh

      - name: Install ARM cross-toolchain (Bootlin, glibc 2.31 -- matches docker/Dockerfile)
        run: |
          set -euo pipefail
          TOOLCHAIN_URL=https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/armv7-eabihf--glibc--stable-2020.08-1.tar.bz2
          sudo mkdir -p /opt/toolchain
          curl -fsSL "$TOOLCHAIN_URL" | sudo tar -xj -C /opt/toolchain --strip-components=1
          echo "/opt/toolchain/bin" >> "$GITHUB_PATH"

      - name: Build blobs
        run: ./scripts/build_blobs_native.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nam-blobs
          path: blobs/
          retention-days: 7

  build-linux:
    needs: build-blobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fslibs-dev liblzma-dev libcurl4-openssl-dev libsdl2-dev

      - uses: actions/download-artifact@v4
        with:
          name: nam-blobs
          path: blobs

      # Guarantee the downloaded blobs' mtimes are newer than the freshly
      # checked-out sources, so CMake's staleness check (see
      # CMakeLists.txt's add_custom_command) doesn't try to rebuild
      # them via Docker here (there's no Docker daemon on this runner
      # anyway -- see build-blobs above for why this job doesn't need it).
      - run: touch blobs/*

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target headrush-nam-gui --parallel

      - run: mv build/headrush-nam-gui build/headrush-nam-gui-linux

      # GitHub Releases strips unix permission bits from raw file assets --
      # a bare binary downloads with no exec bit set. tar preserves the
      # mode itself, so extracting the archive restores +x.
      - name: Package (tar.gz, preserves exec bit)
        run: |
          chmod +x build/headrush-nam-gui-linux
          cp THIRD_PARTY_LICENSES.md build/
          tar -czf build/headrush-nam-gui-linux.tar.gz -C build headrush-nam-gui-linux THIRD_PARTY_LICENSES.md

      - uses: actions/upload-artifact@v4
        with:
          name: headrush-nam-gui-linux
          path: build/headrush-nam-gui-linux.tar.gz

  # macos-latest is an Apple Silicon (arm64) runner; the release binary is
  # universal (arm64 + x86_64 for Intel Macs), built once per arch and
  # lipo-ed together. Dependencies (xz, e2fsprogs, SDL2) are built from
  # source as static libs per arch by scripts/build_deps_macos.sh -- not
  # Homebrew: Homebrew no longer installs on x86_64 at all ("Homebrew on
  # macOS is only supported on Apple Silicon processors!", even under
  # Rosetta), and statically linking means the binary needs nothing
  # installed on the user's Mac. curl comes from the macOS SDK itself.
  #
  # The script writes a deps.cmake initial cache presetting EVERY
  # dependency variable (plus CMAKE_DISABLE_FIND_PACKAGE_SDL2) -- CMake
  # never re-searches a variable already in the cache, so whatever the
  # runner has preinstalled under /opt/homebrew can't leak into either
  # build (it used to: a real run linked /opt/homebrew's arm64 libSDL2
  # into the "x86_64" build via find_package(SDL2)).
  build-macos:
    needs: build-blobs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nam-blobs
          path: blobs

      - run: touch blobs/*

      - name: Build static dependencies (arm64 + x86_64)
        run: |
          ./scripts/build_deps_macos.sh arm64 "$PWD/deps-arm64"
          ./scripts/build_deps_macos.sh x86_64 "$PWD/deps-x86_64"

      - name: Build (arm64)
        run: |
          cmake -C deps-arm64/deps.cmake -S . -B build-arm64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm64 --target headrush-nam-gui --parallel

      - name: Build (x86_64)
        run: |
          cmake -C deps-x86_64/deps.cmake -S . -B build-x86_64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-x86_64 --target headrush-nam-gui --parallel

      - name: Create universal binary
        run: |
          lipo -create -output build-arm64/headrush-nam-gui-macos \
            build-arm64/headrush-nam-gui build-x86_64/headrush-nam-gui
          lipo -info build-arm64/headrush-nam-gui-macos
          # Must be self-contained: only /usr/lib and /System dylibs.
          for arch in arm64 x86_64; do
            if otool -arch "$arch" -L build-arm64/headrush-nam-gui-macos | tail -n +2 | grep -vE '^[[:space:]]*(/usr/lib/|/System/)'; then
              echo "$arch slice links non-system dylibs (above)" >&2
              exit 1
            fi
          done

      # Same as the Linux job -- GitHub Releases strips exec bit from raw
      # assets, tar preserves it.
      - name: Package (tar.gz, preserves exec bit)
        run: |
          chmod +x build-arm64/headrush-nam-gui-macos
          cp THIRD_PARTY_LICENSES.md build-arm64/
          tar -czf build-arm64/headrush-nam-gui-macos.tar.gz -C build-arm64 headrush-nam-gui-macos THIRD_PARTY_LICENSES.md

      - uses: actions/upload-artifact@v4
        with:
          name: headrush-nam-gui-macos
          path: build-arm64/headrush-nam-gui-macos.tar.gz

  build-windows:
    needs: build-blobs
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-ca-certificates
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-SDL2
            p7zip
            make
            tar
            curl

      - uses: actions/download-artifact@v4
        with:
          name: nam-blobs
          path: blobs

      - run: touch blobs/*

      # No vcpkg/MSYS2 package for libext2fs exists -- build it from
      # source once (see the script's own header comment for why this is
      # known to actually work, not just hoped to).
      - name: Build e2fsprogs for Windows
        run: ./scripts/build_e2fsprogs_windows.sh

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target headrush-nam-gui --parallel

      # The exe alone doesn't run on a stock Windows box: it dynamically
      # links libcurl/liblzma/SDL2/libwinpthread from MSYS2's MINGW64
      # environment, none of which Windows ships or an end user has
      # installed (see issue #7 -- "missing DLL" popups for exactly these
      # four). Walk the exe's actual PE import table via `ldd` (resolves
      # against this shell's /mingw64 the same way the dynamic loader
      # would) and copy whatever it names from /mingw64/bin next to it,
      # instead of hardcoding a DLL list that'd silently go stale the next
      # time a dependency changes.
      - name: Bundle runtime DLLs
        run: |
          set -euo pipefail
          mkdir -p build/dist
          cp build/headrush-nam-gui.exe build/dist/headrush-nam-gui-windows.exe
          ldd build/headrush-nam-gui.exe \
            | grep -i '/mingw64/' \
            | awk '{print $3}' \
            | sort -u \
            | xargs -I{} cp {} build/dist/
          ls -la build/dist

      # MSYS2's mingw-w64 curl links OpenSSL (see the DLL list above --
      # libssl-3-x64.dll / libcrypto-3-x64.dll), which needs a real CA
      # bundle *file* to verify HTTPS certs -- unlike Windows-native
      # schannel, it has no OS certificate store to fall back on. Without
      # this the app runs (no missing-DLL popup) but every download fails
      # with curl's own "Problem with the SSL CA cert (path? access
      # rights?)". core/http_download.c points CURLOPT_CAINFO at
      # "ca-bundle.crt" next to the exe on Windows -- ship it there.
      - name: Bundle CA bundle
        run: |
          set -euo pipefail
          CA_BUNDLE=$(pacman -Ql mingw-w64-x86_64-ca-certificates | awk '{print $2}' | grep -E '(ca-bundle\.crt|cacert\.pem)$' | head -1)
          if [ -z "$CA_BUNDLE" ]; then
            echo "Could not locate ca-bundle.crt/cacert.pem from mingw-w64-x86_64-ca-certificates package" >&2
            pacman -Ql mingw-w64-x86_64-ca-certificates >&2
            exit 1
          fi
          cp "$CA_BUNDLE" build/dist/ca-bundle.crt

      # app/win_repack.c shells out to a 7z-compatible CLI to unpack/repack
      # the stock updater's embedded 7z SFX archive. Never rely on "7z"
      # being on the end user's PATH (most don't have any 7-Zip CLI on
      # PATH, even those with the 7-Zip GUI installed) -- ship the real
      # thing next to the exe instead. windows-latest runners come with
      # 7-Zip preinstalled system-wide; reuse that copy (7z.exe needs
      # 7z.dll alongside it -- it LoadLibrary()s it for its codecs) rather
      # than MSYS2's `p7zip` package, which is an MSYS-POSIX-layer build
      # that depends on msys-2.0.dll and isn't a standalone Windows binary.
      - name: Bundle 7-Zip
        run: |
          set -euo pipefail
          SEVENZIP_DIR="/c/Program Files/7-Zip"
          if [ ! -f "$SEVENZIP_DIR/7z.exe" ] || [ ! -f "$SEVENZIP_DIR/7z.dll" ]; then
            echo "7-Zip not found at '$SEVENZIP_DIR' -- windows-latest image may have changed" >&2
            exit 1
          fi
          cp "$SEVENZIP_DIR/7z.exe" "$SEVENZIP_DIR/7z.dll" build/dist/
          # Ship 7-Zip's own License.txt verbatim alongside it, on top of
          # (not instead of) THIRD_PARTY_LICENSES.md's summary below --
          # this is the authoritative copy of the LGPL 2.1 + unRAR
          # restriction terms for 7z.exe/7z.dll.
          if [ -f "$SEVENZIP_DIR/License.txt" ]; then
            cp "$SEVENZIP_DIR/License.txt" build/dist/7-Zip-License.txt
          else
            echo "warning: $SEVENZIP_DIR/License.txt not found, skipping" >&2
          fi

      # Every runtime dependency bundled above (curl, SDL2, xz, mingw
      # winpthreads, OpenSSL, 7-Zip) carries its own license terms and
      # attribution requirements -- see THIRD_PARTY_LICENSES.md for why
      # each one is here and its full license text.
      - name: Bundle third-party license notices
        run: cp THIRD_PARTY_LICENSES.md build/dist/

      - name: Zip Windows dist
        run: |
          cd build/dist
          7z a ../headrush-nam-gui-windows.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: headrush-nam-gui-windows
          path: build/headrush-nam-gui-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: headrush-nam-gui-*
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
