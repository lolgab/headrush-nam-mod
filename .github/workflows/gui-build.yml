name: gui build

# Milestone 6 (see .claude/plans/crystalline-baking-moonbeam.md): builds
# gui/ on every push/PR touching it (or the patch/nam_core sources its
# blobs depend on), and uploads the resulting binaries as release assets
# on version tags.
#
# Windows builds under MSYS2's MINGW64 environment (native mingw-w64 gcc,
# not the MSYS POSIX layer -- produces a normal Windows .exe depending
# only on the mingw-w64 runtime). curl/xz/SDL2 all have ready-made
# mingw-w64-x86_64-* MSYS2 packages; libext2fs does not (no vcpkg or
# MSYS2 package exists), so gui/scripts/build_e2fsprogs_windows.sh builds
# it from source instead -- confirmed to actually work by cross-compiling
# it for mingw-w64 in Docker before writing that script (see
# gui/README.md's verification section).
on:
  push:
    branches: [main]
    paths:
      - "gui/**"
      - "patch/**"
      - ".github/workflows/gui-build.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "gui/**"
      - "patch/**"
      - ".github/workflows/gui-build.yml"

jobs:
  # Cross-compiles gui/blobs/*: no Docker needed in CI (unlike local dev,
  # see gui/scripts/build_blobs.sh) since the runner OS is already Linux --
  # just install the same Bootlin ARM toolchain docker/Dockerfile uses and
  # run gui/scripts/build_blobs_native.sh directly.
  build-blobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nam_core
        run: ./scripts/fetch_nam_core.sh

      - name: Install ARM cross-toolchain (Bootlin, glibc 2.31 -- matches docker/Dockerfile)
        run: |
          set -euo pipefail
          TOOLCHAIN_URL=https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/armv7-eabihf--glibc--stable-2020.08-1.tar.bz2
          sudo mkdir -p /opt/toolchain
          curl -fsSL "$TOOLCHAIN_URL" | sudo tar -xj -C /opt/toolchain --strip-components=1
          echo "/opt/toolchain/bin" >> "$GITHUB_PATH"

      - name: Build blobs
        run: ./gui/scripts/build_blobs_native.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nam-blobs
          path: gui/blobs/
          retention-days: 7

  build-linux:
    needs: build-blobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fslibs-dev liblzma-dev libcurl4-openssl-dev libsdl2-dev

      - uses: actions/download-artifact@v4
        with:
          name: nam-blobs
          path: gui/blobs

      # Guarantee the downloaded blobs' mtimes are newer than the freshly
      # checked-out sources, so CMake's staleness check (see
      # gui/CMakeLists.txt's add_custom_command) doesn't try to rebuild
      # them via Docker here (there's no Docker daemon on this runner
      # anyway -- see build-blobs above for why this job doesn't need it).
      - run: touch gui/blobs/*

      - name: Build
        run: |
          cmake -S gui -B gui/build -DCMAKE_BUILD_TYPE=Release
          cmake --build gui/build --target headrush-nam-gui --parallel

      - run: mv gui/build/headrush-nam-gui gui/build/headrush-nam-gui-linux

      - uses: actions/upload-artifact@v4
        with:
          name: headrush-nam-gui-linux
          path: gui/build/headrush-nam-gui-linux

  # macos-latest is an Apple Silicon (arm64) runner, so getting a real
  # x86_64 build too (for Intel Macs) means building twice and lipo-ing the
  # results together -- Homebrew itself has no cross-arch support. The
  # x86_64 pass runs under Rosetta 2 with its OWN Homebrew prefix at
  # /usr/local (the traditional Intel path, kept separate from the native
  # arm64 install at /opt/homebrew) -- `arch -x86_64` re-execs everything
  # (brew, cmake, the compiler) via their own x86_64 slices, which
  # transparently produces genuine x86_64 objects with no cross-compile
  # flags needed. CMAKE_IGNORE_PATH on each pass keeps that pass from
  # accidentally resolving find_path/find_library to the OTHER arch's
  # dylibs -- gui/CMakeLists.txt's e2fsprogs/curl/lzma searches hardcode
  # BOTH /opt/homebrew/opt/<pkg> and /usr/local/opt/<pkg> in their PATHS
  # lists (for regular single-arch dev machines), so both are on disk
  # simultaneously here and would otherwise silently pick whichever ends
  # up first, which can fail to link (or worse, not fail) depending on
  # search order.
  build-macos:
    needs: build-blobs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nam-blobs
          path: gui/blobs

      - run: touch gui/blobs/*

      - name: Install arm64 dependencies
        run: brew install e2fsprogs xz curl sdl2

      - name: Build (arm64, native)
        run: |
          cmake -S gui -B gui/build-arm64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_IGNORE_PATH="/usr/local/include;/usr/local/lib;/usr/local/opt/curl/include;/usr/local/opt/curl/lib;/usr/local/opt/xz/include;/usr/local/opt/xz/lib;/usr/local/opt/e2fsprogs/include;/usr/local/opt/e2fsprogs/lib"
          cmake --build gui/build-arm64 --target headrush-nam-gui --parallel

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Install x86_64 Homebrew + dependencies
        run: |
          if [ ! -x /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          arch -x86_64 /usr/local/bin/brew install cmake e2fsprogs xz curl sdl2

      - name: Build (x86_64, under Rosetta)
        run: |
          # The system/PATH `cmake` here is arm64-only (no x86_64 slice --
          # `arch -x86_64 cmake` fails with "Bad CPU type in executable"),
          # so use the x86_64 Homebrew's own cmake explicitly. cc/clang
          # (invoked by cmake/ninja as this runs) IS a universal Apple
          # binary, so the `arch -x86_64` wrapper here still matters -- it's
          # inherited by the whole child process tree, including those
          # compiler invocations.
          arch -x86_64 /usr/local/bin/cmake -S gui -B gui/build-x86_64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_IGNORE_PATH="/opt/homebrew/include;/opt/homebrew/lib;/opt/homebrew/opt/curl/include;/opt/homebrew/opt/curl/lib;/opt/homebrew/opt/xz/include;/opt/homebrew/opt/xz/lib;/opt/homebrew/opt/e2fsprogs/include;/opt/homebrew/opt/e2fsprogs/lib"
          arch -x86_64 /usr/local/bin/cmake --build gui/build-x86_64 --target headrush-nam-gui --parallel

      - name: Create universal binary
        run: |
          lipo -create -output gui/build-arm64/headrush-nam-gui-macos \
            gui/build-arm64/headrush-nam-gui gui/build-x86_64/headrush-nam-gui
          lipo -info gui/build-arm64/headrush-nam-gui-macos

      - uses: actions/upload-artifact@v4
        with:
          name: headrush-nam-gui-macos
          path: gui/build-arm64/headrush-nam-gui-macos

  build-windows:
    needs: build-blobs
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-SDL2
            p7zip
            make
            tar
            curl

      - uses: actions/download-artifact@v4
        with:
          name: nam-blobs
          path: gui/blobs

      - run: touch gui/blobs/*

      # No vcpkg/MSYS2 package for libext2fs exists -- build it from
      # source once (see the script's own header comment for why this is
      # known to actually work, not just hoped to).
      - name: Build e2fsprogs for Windows
        run: ./gui/scripts/build_e2fsprogs_windows.sh

      - name: Build
        run: |
          cmake -S gui -B gui/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build gui/build --target headrush-nam-gui --parallel

      - run: mv gui/build/headrush-nam-gui.exe gui/build/headrush-nam-gui-windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: headrush-nam-gui-windows
          path: gui/build/headrush-nam-gui-windows.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: headrush-nam-gui-*
          path: artifacts
          merge-multiple: true

      - run: chmod +x artifacts/*

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
