name: gui build

# Milestone 6 (see .claude/plans/crystalline-baking-moonbeam.md): builds
# the GUI on every push/PR touching it (or the patch/nam_core sources its
# blobs depend on), and uploads the resulting binaries as release assets
# on version tags.
#
# Windows builds under MSYS2's MINGW64 environment (native mingw-w64 gcc,
# not the MSYS POSIX layer -- produces a normal Windows .exe depending
# only on the mingw-w64 runtime). curl/xz/SDL2 all have ready-made
# mingw-w64-x86_64-* MSYS2 packages; libext2fs does not (no vcpkg or
# MSYS2 package exists), so scripts/build_e2fsprogs_windows.sh builds
# it from source instead -- confirmed to actually work by cross-compiling
# it for mingw-w64 in Docker before writing that script (see
# docs/BUILDING.md's verification section).
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "app/**"
      - "tools/**"
      - "third_party/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "patch/**"
      - ".github/workflows/gui-build.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "core/**"
      - "app/**"
      - "tools/**"
      - "third_party/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "patch/**"
      - ".github/workflows/gui-build.yml"

jobs:
  # Cross-compiles blobs/*: no Docker needed in CI (unlike local dev,
  # see scripts/build_blobs.sh) since the runner OS is already Linux --
  # just install the same Bootlin ARM toolchain docker/Dockerfile uses and
  # run scripts/build_blobs_native.sh directly.
  build-blobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nam_core
        run: ./scripts/fetch_nam_core.sh

      - name: Install ARM cross-toolchain (Bootlin, glibc 2.31 -- matches docker/Dockerfile)
        run: |
          set -euo pipefail
          TOOLCHAIN_URL=https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/armv7-eabihf--glibc--stable-2020.08-1.tar.bz2
          sudo mkdir -p /opt/toolchain
          curl -fsSL "$TOOLCHAIN_URL" | sudo tar -xj -C /opt/toolchain --strip-components=1
          echo "/opt/toolchain/bin" >> "$GITHUB_PATH"

      - name: Build blobs
        run: ./scripts/build_blobs_native.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nam-blobs
          path: blobs/
          retention-days: 7

  build-linux:
    needs: build-blobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fslibs-dev liblzma-dev libcurl4-openssl-dev libsdl2-dev

      - uses: actions/download-artifact@v4
        with:
          name: nam-blobs
          path: blobs

      # Guarantee the downloaded blobs' mtimes are newer than the freshly
      # checked-out sources, so CMake's staleness check (see
      # CMakeLists.txt's add_custom_command) doesn't try to rebuild
      # them via Docker here (there's no Docker daemon on this runner
      # anyway -- see build-blobs above for why this job doesn't need it).
      - run: touch blobs/*

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target headrush-nam-gui --parallel

      - run: mv build/headrush-nam-gui build/headrush-nam-gui-linux

      - uses: actions/upload-artifact@v4
        with:
          name: headrush-nam-gui-linux
          path: build/headrush-nam-gui-linux

  # macos-latest is an Apple Silicon (arm64) runner, so getting a real
  # x86_64 build too (for Intel Macs) means building twice and lipo-ing the
  # results together -- Homebrew itself has no cross-arch support. The
  # x86_64 pass runs under Rosetta 2 with its OWN Homebrew prefix at
  # /usr/local (the traditional Intel path, kept separate from the native
  # arm64 install at /opt/homebrew) -- `arch -x86_64` re-execs everything
  # (brew, cmake, the compiler) via their own x86_64 slices, which
  # transparently produces genuine x86_64 objects with no cross-compile
  # flags needed.
  #
  # Once both Homebrew prefixes exist side by side, CMakeLists.txt's
  # find_path/find_library calls for curl/lzma/e2fsprogs/SDL2 can resolve
  # to EITHER arch's dylib (their PATHS lists check both
  # /opt/homebrew/opt/<pkg> and /usr/local/opt/<pkg>, for regular
  # single-arch dev machines). CMAKE_IGNORE_PATH does NOT reliably filter
  # this -- confirmed the hard way: a real macos-latest run still linked
  # /opt/homebrew's arm64 libSDL2 into the "x86_64" build via
  # find_package(SDL2)'s own resolution despite CMAKE_IGNORE_PATH listing
  # every /opt/homebrew path involved. Fix: preset every dependency
  # variable explicitly via -D on the x86_64 configure line (plus
  # -DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON to force SDL2's find_package
  # short-circuit off, so the manual find_path/find_library fallback runs)
  # -- CMake never re-searches a variable already present in the cache, so
  # this is fully deterministic regardless of what's on disk at either
  # prefix.
  build-macos:
    needs: build-blobs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nam-blobs
          path: blobs

      - run: touch blobs/*

      - name: Install arm64 dependencies
        run: brew install e2fsprogs xz curl sdl2

      - name: Build (arm64, native)
        run: |
          cmake -S . -B build-arm64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm64 --target headrush-nam-gui --parallel

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Install x86_64 Homebrew + dependencies
        run: |
          if [ ! -x /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          arch -x86_64 /usr/local/bin/brew install cmake e2fsprogs xz curl sdl2

      - name: Build (x86_64, under Rosetta)
        run: |
          # The system/PATH `cmake` here is arm64-only (no x86_64 slice --
          # `arch -x86_64 cmake` fails with "Bad CPU type in executable"),
          # so use the x86_64 Homebrew's own cmake explicitly. cc/clang
          # (invoked by cmake/ninja as this runs) IS a universal Apple
          # binary, so the `arch -x86_64` wrapper here still matters -- it's
          # inherited by the whole child process tree, including those
          # compiler invocations.
          arch -x86_64 /usr/local/bin/cmake -S . -B build-x86_64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON \
            -DCURL_INCLUDE_DIR=/usr/local/opt/curl/include \
            -DCURL_LIBRARY=/usr/local/opt/curl/lib/libcurl.dylib \
            -DLZMA_INCLUDE_DIR=/usr/local/opt/xz/include \
            -DLZMA_LIBRARY=/usr/local/opt/xz/lib/liblzma.dylib \
            -DE2FSPROGS_INCLUDE_DIR=/usr/local/opt/e2fsprogs/include \
            -DE2FSPROGS_ext2fs_LIBRARY=/usr/local/opt/e2fsprogs/lib/libext2fs.a \
            -DE2FSPROGS_e2p_LIBRARY=/usr/local/opt/e2fsprogs/lib/libe2p.a \
            -DE2FSPROGS_com_err_LIBRARY=/usr/local/opt/e2fsprogs/lib/libcom_err.a \
            -DE2FSPROGS_blkid_LIBRARY=/usr/local/opt/e2fsprogs/lib/libblkid.a \
            -DE2FSPROGS_uuid_LIBRARY=/usr/local/opt/e2fsprogs/lib/libuuid.a \
            -DSDL2_INCLUDE_DIRS=/usr/local/include/SDL2 \
            -DSDL2_LIBRARIES=/usr/local/lib/libSDL2.dylib
          arch -x86_64 /usr/local/bin/cmake --build build-x86_64 --target headrush-nam-gui --parallel

      - name: Create universal binary
        run: |
          lipo -create -output build-arm64/headrush-nam-gui-macos \
            build-arm64/headrush-nam-gui build-x86_64/headrush-nam-gui
          lipo -info build-arm64/headrush-nam-gui-macos

      - uses: actions/upload-artifact@v4
        with:
          name: headrush-nam-gui-macos
          path: build-arm64/headrush-nam-gui-macos

  build-windows:
    needs: build-blobs
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-SDL2
            p7zip
            make
            tar
            curl

      - uses: actions/download-artifact@v4
        with:
          name: nam-blobs
          path: blobs

      - run: touch blobs/*

      # No vcpkg/MSYS2 package for libext2fs exists -- build it from
      # source once (see the script's own header comment for why this is
      # known to actually work, not just hoped to).
      - name: Build e2fsprogs for Windows
        run: ./scripts/build_e2fsprogs_windows.sh

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target headrush-nam-gui --parallel

      - run: mv build/headrush-nam-gui.exe build/headrush-nam-gui-windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: headrush-nam-gui-windows
          path: build/headrush-nam-gui-windows.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: headrush-nam-gui-*
          path: artifacts
          merge-multiple: true

      - run: chmod +x artifacts/*

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
